<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HBOD Lern-App</title>
<meta name="description" content="Lern-App für E-Commerce und HBOD">
<meta name="theme-color" content="#15202b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HBOD Lernen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f6f8fa; --ink: #15202b; --muted: #5b6773; --line: #d5dbe1;
  --accent: #2f4bd8; --accent-ink: #ffffff; --accent-soft: #e4e9fd;
  --ok: #1d7f55; --ok-soft: #dff3e9; --bad: #c13d2c; --bad-soft: #fbe4e0; --part: #a86a12; --part-soft: #f8ecd7;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --surface-2: #1c2733; --ink: #e6ebf0; --muted: #93a1ae; --line: #2a3642;
    --accent: #8ea1ff; --accent-ink: #0f151c; --accent-soft: #222d4d;
    --ok: #4cc28a; --ok-soft: #143326; --bad: #f07a6a; --bad-soft: #3a1c18; --part: #e3ad57; --part-soft: #3a2c14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --surface-2: #1c2733; --ink: #e6ebf0; --muted: #93a1ae; --line: #2a3642;
  --accent: #8ea1ff; --accent-ink: #0f151c; --accent-soft: #222d4d;
  --ok: #4cc28a; --ok-soft: #143326; --bad: #f07a6a; --bad-soft: #3a1c18; --part: #e3ad57; --part-soft: #3a2c14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.spacer { flex: 1; }

.top {
  position: sticky; top: 0; z-index: 5; background: var(--surface);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; flex: none; }
.brand-t { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1; }
.brand-s { font-size: 0.75rem; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.nav { display: flex; gap: 6px; margin-left: auto; }
.nav button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 0.88rem; cursor: pointer; }
.nav button[aria-current="page"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: var(--radius); cursor: pointer; font-weight: 500; min-height: 44px; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.klein { min-height: 36px; padding: 6px 10px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
.btn:focus-visible, .nav button:focus-visible, .opt:focus-within, .deck:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .linkbtn:focus-visible, .rate button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.head { padding-block: 20px 6px; display: grid; gap: 6px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.part { background: var(--part-soft); color: var(--part); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag { display: inline-flex; font-family: var(--font-mono); font-size: 0.75rem; padding: 2px 7px; border-radius: 4px; background: var(--ink); color: var(--surface); }
.zahlen { display: inline-flex; gap: 10px; font-family: var(--font-mono); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.zahlen span { min-width: 1.6em; text-align: right; }
.z-neu { color: var(--accent); } .z-faellig { color: var(--ok); } .z-null { color: var(--muted); opacity: .6; }

/* Lernen: Startseite */
.heute { background: var(--ink); color: var(--surface); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.heute .muted { color: color-mix(in srgb, var(--surface) 72%, transparent); }
.heute .big { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.heute .duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.heute .btn.primary { background: var(--surface); color: var(--ink); border-color: var(--surface); font-weight: 600; }
.heute .btn.ghost { color: var(--surface); border-color: color-mix(in srgb, var(--surface) 40%, transparent); }
.heute .bar { background: color-mix(in srgb, var(--surface) 15%, transparent); border-color: transparent; }
.heute .bar i { background: var(--surface); }
.bereich { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; padding: 0; }
.bereich > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 14px; }
.bereich > summary::-webkit-details-marker { display: none; }
.bereich > summary .buchst { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--accent); grid-row: 1 / 3; text-align: center; }
.bereich > summary .t { font-weight: 600; line-height: 1.3; }
.bereich > summary .meta { grid-column: 2; font-size: 0.8rem; color: var(--muted); }
.bereich > summary .zahlen { grid-column: 3; grid-row: 1 / 3; }
.bereich[open] > summary { border-bottom: 1px solid var(--line); }
.bereich-in { display: grid; }
.deck { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 11px 14px 11px 3.5em; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.deck:hover { background: var(--surface-2); }
.deck .t { line-height: 1.3; }
.deck .meta { font-size: 0.78rem; color: var(--muted); }
.deck .zahlen { grid-column: 2; grid-row: 1 / 3; }
.bereich-aktion { padding: 10px 14px 12px 3.5em; display: flex; gap: 8px; flex-wrap: wrap; background: var(--surface-2); }

/* Stapel */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.trio b { display: block; font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
details > summary { cursor: pointer; font-weight: 600; }
details.wichtig { padding: 12px 14px; }
.wichtig ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 8px; }
.merksatz { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; font-weight: 500; }

/* Lernen: Karte */
.laufkopf { padding-block: 14px 4px; display: grid; gap: 8px; }
.qtext { font-size: 1.12rem; font-weight: 500; line-height: 1.45; margin-top: 8px; }
.qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; min-height: 48px; }
.opt input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .mark { margin-left: auto; font-size: 0.8rem; font-weight: 600; white-space: nowrap; padding-left: 8px; }
.opt.right .mark { color: var(--ok); } .opt.wrong .mark { color: var(--bad); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.tf button { min-height: 52px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.tf button.sel { border-color: var(--accent); background: var(--accent-soft); }
.tf button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.tf button.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.num { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.num input, .codein { font: inherit; font-family: var(--font-mono); font-size: 1.2rem; width: 100%; max-width: 260px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.num .unit { font-family: var(--font-mono); color: var(--muted); }
.match { display: grid; gap: 10px; margin-top: 14px; }
.match-row { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.match-row.right { border-color: var(--ok); background: var(--ok-soft); }
.match-row.wrong { border-color: var(--bad); background: var(--bad-soft); }
select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; max-width: 100%; }
textarea { line-height: 1.5; resize: vertical; }
.order { display: grid; gap: 8px; margin-top: 14px; padding: 0; list-style: none; }
.order li { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.order li .pos { font-family: var(--font-mono); color: var(--accent); width: 1.6em; flex: none; }
.order li span.txt { flex: 1; min-width: 0; }
.order li .mv { display: flex; gap: 4px; flex: none; }
.order li .mv button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.order li.right { border-color: var(--ok); background: var(--ok-soft); }
.order li.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { margin-top: 16px; border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 8px; }
.fb.ok { border-color: var(--ok); background: var(--ok-soft); }
.fb.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb .verdict { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.fb.ok .verdict { color: var(--ok); } .fb.bad .verdict { color: var(--bad); }
.fb ul, .fb ol { margin: 4px 0 0; padding-left: 1.2em; }
.hint { font-size: 0.88rem; border-left: 3px solid var(--part); padding-left: 10px; color: var(--ink); }
.src { font-size: 0.8rem; color: var(--muted); }
.rate { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; }
.rate button { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; min-height: 58px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.rate button span { font-size: 0.78rem; font-weight: 400; color: var(--muted); }
.rate .nochmal { border-color: var(--bad); color: var(--bad); }
.rate .schwer { border-color: var(--part); color: var(--part); }
.rate .gut { border-color: var(--ok); color: var(--ok); }
.rate .leicht { border-color: var(--accent); color: var(--accent); }
.unter { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-top: 14px; }
.keys { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
@media (hover: none), (pointer: coarse) { .keys { display: none; } }
.liste { display: grid; gap: 10px; }
.karte { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); display: grid; gap: 6px; }
.karte .antw { font-weight: 600; }
.karte.bad { border-left: 4px solid var(--bad); }
.result-big { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* Notizen, Fenster, Claude */
.notes { display: grid; gap: 10px; }
.note { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); display: grid; gap: 4px; }
.note.erledigt { opacity: .8; }
.rueck { border-left: 3px solid var(--ok); background: var(--ok-soft); padding: 8px 10px; border-radius: 0 8px 8px 0; display: grid; gap: 2px; }
.rueck .label { color: var(--ok); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 0.85rem; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 2rem; line-height: 1; cursor: pointer; z-index: 15; box-shadow: 0 4px 14px color-mix(in srgb, var(--ink) 30%, transparent); display: grid; place-items: center; padding: 0 0 3px; }
.fab:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
dialog#dlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100% - 24px)); max-height: calc(100dvh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
dialog#dlg::backdrop { background: rgba(15, 21, 28, .45); }
.dlg-in { padding: 16px 18px 18px; display: grid; gap: 10px; }
.dlg-kopf { display: flex; align-items: center; gap: 10px; }
.dlg-kopf h2 { flex: 1; font-size: 1.25rem; }
.dlg-zu { border: 0; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--muted); width: 40px; height: 40px; border-radius: 8px; }
.dlg-zu:hover { background: var(--surface-2); }
.dlg-in input[type=text], .chatform input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
.typwahl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.typwahl button { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 11px; cursor: pointer; min-height: 52px; }
.typwahl button span { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.typwahl button.sel { border-color: var(--accent); background: var(--accent-soft); }
.treffer { display: grid; gap: 6px; }
.treffer-i { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 0.9rem; }
.treffer-i.sel { border-color: var(--accent); background: var(--accent-soft); }
.treffer-i .t { flex: 1; min-width: 0; }
.treffer-i input { margin-top: 3px; accent-color: var(--accent); flex: none; }
.claude-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.claude-row select { width: auto; max-width: 100%; padding: 4px 8px; font-size: 0.85rem; }
.chatform { display: grid; gap: 8px; }
.chatlist { display: grid; gap: 8px; }
.chatitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.chatitem .url { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chatitem .row { grid-column: 2; grid-row: 1 / 3; }
.codebig { font-family: var(--font-mono); font-size: 1.35rem; letter-spacing: 0.04em; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface-2); word-break: break-all; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--ok); } .dot.warn { background: var(--part); } .dot.off { background: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.copyarea { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: 0.8rem; }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); }
.prose { display: grid; gap: 10px; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
@media (max-width: 560px) {
  .panel { padding: 14px; }
  .qtext { font-size: 1.05rem; }
  .nav { margin-left: 0; width: 100%; }
  .nav button { flex: 1; }
  .actions .btn { flex: 1 1 auto; }
  .typwahl { grid-template-columns: 1fr; }
  .deck, .bereich-aktion { padding-left: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fb { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media print { .top, .actions, .fab, .unter { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="brand" type="button" aria-label="Zur Startseite">
      <span class="brand-mark">KAM</span>
      <span><span class="brand-t">HBOD Lern-App</span><br><span class="brand-s" id="savestate"><i class="dot"></i><span>Lade …</span></span></span>
    </button>
    <nav class="nav" id="nav" aria-label="Bereiche der App">
      <button type="button" data-go="lernen">Lernen</button>
      <button type="button" data-go="notizen">Notizen</button>
      <button type="button" data-go="einstellungen">Einstellungen</button>
    </nav>
  </div>
</header>

// Kreislauf: Nils merkt an oder wünscht sich etwas -> die App zeigt sofort Ähnliches -> Claude prüft beim Einarbeiten
// (inhalte/suche.py), baut ein und antwortet in inhalte/rueckmeldungen.py -> die Antwort steht hier an der Notiz.
const NOTIZ_TYP = { pruefen: "Antwort prüfen", unklar: "Unklar", doppelt: "Doppelt", ergaenzung: "Ergänzung", frage: "Wunsch: neue Frage", thema: "Wunsch: neues Thema", erkenntnis: "Erkenntnis", sonstiges: "Anmerkung" };
const NOTIZ_FARBE = { pruefen: "bad", unklar: "part", doppelt: "part", ergaenzung: "acc", frage: "acc", thema: "acc", erkenntnis: "ok", sonstiges: "" };
function notizTyp(n) { if (n && n.typ && NOTIZ_TYP[n.typ]) return n.typ; if (n && n.art === "wunsch") return "frage"; return n && n.frage_id ? "sonstiges" : "erkenntnis"; }
function rueckVon(n) { return (S.daten && S.daten.rueckmeldungen && S.daten.rueckmeldungen[n.id]) || null; }
function notizStatus(n) {
  if (!n) return "offen";
  if (n.status === "geloescht") return "geloescht";
  if (n.status === "erledigt") return "erledigt";
  const r = rueckVon(n);
  if (r && !(n.wieder && n.wieder > r.zeit)) return "erledigt";
  return "offen";
}
let PAUSE = null;
function pausiert(q) {
  if (!PAUSE) { PAUSE = new Set(); for (const n of Object.values(S.notizen)) if (n && n.pause && n.frage_id && notizStatus(n) === "offen") PAUSE.add(n.frage_id); }
  return PAUSE.has(q);
}
function notizId() { const b = new Uint8Array(6); crypto.getRandomValues(b); return "n" + Date.now().toString(36) + [...b].map(x => x.toString(36)).join("").slice(0, 8); }
function speichereNotiz(n, meldung) {
  const id = notizId(); n.id = id; n.zeit = nowIso();
  S.notizen[id] = n; S.outbox.notizen[id] = n; PAUSE = null; planeSync(500);
  toast((meldung || "Gespeichert.") + (S.code ? "" : " Verbinde deine Geräte, damit es überall da ist."));
}
function setzeNotizStatus(n, status) {
  const neu = Object.assign({}, n, { status, zeit: nowIso() });
  if (status === "offen" && rueckVon(n)) neu.wieder = nowIso();
  S.notizen[n.id] = neu; S.outbox.notizen[n.id] = neu; PAUSE = null; planeSync(500); render();

/* ---------- Ähnliche Fragen und Stapel finden (wie inhalte/aehnlich.py) ---------- */
const STOPW = new Set(("der die das ein eine einer eines einem einen und oder ist sind was wie wer wo warum wann welche welcher welches bei mit von für auf aus im in an zu zum zur " +
  "den dem des nicht kein keine es sie er man du ich wir ihr hbod sich auch als dass so nur noch dann wenn über etwa je pro bis vom am um wird werden kann muss darf hat haben " +
  "gibt mehr sehr oft kreuze alles richtige richtig falsch marke kunde kunden ihre ihren deine deiner dein diese dieser dieses").split(" "));
function woerter(t) { return (String(t || "").toLowerCase().match(/[a-zäöüß0-9]+/g) || []).filter(w => w.length > 2 && !STOPW.has(w) && !/^\d+$/.test(w)).map(w => w.slice(0, 7)); }
let SUCHINDEX = null;
function suchIndex() {
  if (SUCHINDEX) return SUCHINDEX;
  const eintraege = [];
  for (const q of S.reihenfolge) { const f = S.fragen[q]; eintraege.push({ art: "frage", id: q, text: [f.frage, f.frage, loesungText(f), f.erklaerung].join(" ") }); }
  for (const s of Object.values(S.stapel)) eintraege.push({ art: "stapel", id: s.id, text: [s.titel, s.titel, s.titel, s.beschreibung].concat(s.punkte || []).join(" ") });
  const df = new Map();
  const zaehleW = (text) => { const c = new Map(); for (const w of woerter(text)) c.set(w, (c.get(w) || 0) + 1); return c; };
  const docs = eintraege.map(e => { const c = zaehleW(e.text); for (const w of c.keys()) df.set(w, (df.get(w) || 0) + 1); return c; });
  const N = eintraege.length;
  const vek = (c) => { const v = new Map(); let n2 = 0; for (const [w, n] of c) { const x = (1 + Math.log(n)) * Math.log((N + 1) / ((df.get(w) || 0) + 0.5)); v.set(w, x); n2 += x * x; } const norm = Math.sqrt(n2) || 1; for (const [w, x] of v) v.set(w, x / norm); return v; };
  SUCHINDEX = { eintraege, zaehleW, vek, vecs: docs.map(vek) };
  return SUCHINDEX;
}
function aehnliche(text, n = 6, ohne = null, schwelle = 0.12) {
  const ix = suchIndex(); const c = ix.zaehleW(text);
  if (!c.size) return [];
  const q = ix.vek(c); const out = [];
  ix.vecs.forEach((v, i) => { let s = 0; for (const [w, x] of q) s += x * (v.get(w) || 0); const e = ix.eintraege[i]; if (s >= schwelle && e.id !== ohne) out.push(Object.assign({ s }, e)); });
  return out.sort((a, b) => b.s - a.s).slice(0, n);
}

const WUNSCH_TYPEN = [["frage", "Neue Frage"], ["thema", "Neues Thema"], ["erkenntnis", "Erkenntnis"]];

      st.length ? trefferListe(st) : null,

  };

  ta.addEventListener("input", spaeter); antwort.addEventListener("input", spaeter);
  function zeichne() {
    typBox.replaceChildren(...WUNSCH_TYPEN.map(([k, txt]) => h("button", { type: "button", "aria-pressed": typ === k ? "true" : "false", onclick: () => { typ = k; zeichne(); } }, txt)));

  try {
    const r = await fetch("/fragen.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!Array.isArray(d.stapel)) throw new Error("altes Format");
    indexDaten(d);
    return true;
  } catch (e) {
    $("#app").replaceChildren(h("div", { class: "panel empty", style: "margin-top:20px" }, "Der Fragenkatalog konnte nicht geladen werden. ", h("button", { class: "btn", type: "button", onclick: () => location.reload() }, "Neu laden")));
    return false;
  }
}
