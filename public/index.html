<style>

.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0; overflow: hidden; flex: none; }
.brand-t { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1; }

.btn:focus-visible, .nav button:focus-visible, .opt:focus-within, .card-test:focus-visible, .qgrid button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stack { display: flex; flex-direction: column; gap: 14px; }
.spacer { flex: 1; }

.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.tf button { min-height: 52px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.tf button.sel { border-color: var(--accent); background: var(--accent-soft); }
.tf button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.tf button.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.num { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.num input, .codein { font: inherit; font-family: var(--font-mono); font-size: 1.2rem; width: 100%; max-width: 260px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.num .unit { font-family: var(--font-mono); color: var(--muted); }
.match { display: grid; gap: 10px; margin-top: 14px; }
.match-row { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.match-row.right { border-color: var(--ok); background: var(--ok-soft); }
.match-row.wrong { border-color: var(--bad); background: var(--bad-soft); }
.match-row b { font-weight: 600; }
select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; max-width: 100%; }
textarea { line-height: 1.5; resize: vertical; }
.order { display: grid; gap: 8px; margin-top: 14px; padding: 0; list-style: none; }
.order li { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.fb.part { border-color: var(--part); background: var(--part-soft); }

.fb.ok .verdict { color: var(--ok); } .fb.bad .verdict { color: var(--bad); } .fb.part .verdict { color: var(--part); }

.fb .opt { background: var(--surface); }
.hint { font-size: 0.88rem; border-left: 3px solid var(--part); padding-left: 10px; color: var(--ink); }
.src { font-size: 0.8rem; color: var(--muted); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); }
details summary { cursor: pointer; font-weight: 600; }
.note-box { margin-top: 12px; display: grid; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--ok); } .dot.warn { background: var(--part); } .dot.off { background: var(--bad); }
.result-big { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 10px; margin-top: 14px; }
.review-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); display: grid; gap: 6px; }
.review-item.ok { border-left: 4px solid var(--ok); } .review-item.bad { border-left: 4px solid var(--bad); } .review-item.part { border-left: 4px solid var(--part); }

.zettel-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); display: grid; gap: 6px; }
.zettel-item .antw { font-weight: 600; }
.notes { display: grid; gap: 10px; margin-top: 12px; }
.note { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); display: grid; gap: 4px; }
.prose { display: grid; gap: 10px; max-width: 65ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.codebig { font-family: var(--font-mono); font-size: 1.35rem; letter-spacing: 0.04em; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface-2); word-break: break-all; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.copyarea { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: 0.8rem; }
.empty { padding: 30px 18px; text-align: center; color: var(--muted); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 0.85rem; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 10px; }
  .stat b { font-size: 1.35rem; }
  .panel { padding: 14px; }
  .qtext { font-size: 1.05rem; }
  .nav { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }

  .nav button { flex: none; }
  .actions .btn { flex: 1 1 auto; }

@media (prefers-reduced-motion: no-preference) {

}
@media print { .top, .actions, .note-box { display: none !important; } body { background: #fff; } }
</style>
</head>

/* ================= Lern-Code ================= */
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const CODE_RE = /^[A-HJ-NP-Z2-9]{4}(-[A-HJ-NP-Z2-9]{4}){3}$/;

  if (ok) toast(neu ? "Lern-Code erstellt. Dein Fortschritt wird jetzt überall gespeichert." : "Verbunden. Dein Fortschritt ist jetzt auf diesem Gerät.");
  else toast(S.sync.status === "kein_server" ? "Der Sync-Server ist nicht erreichbar. Läuft die App auf Netlify?" : "Verbindung gerade nicht möglich. Es wird später erneut versucht.");

/* ---------- Eingabefelder ---------- */

/* ================= Kopieren für Claude ================= */
function textBlock(titel, qids, ergebnisse) {
  const zeilen = ["HBOD Lern-App – " + titel, "Fragenkatalog " + S.daten.version + " (" + S.daten.stand + ")", ""];
  let p = 0, n = 0;
  for (const q of qids) {
    const f = S.fragen[q]; const e = (ergebnisse && ergebnisse[q]) || S.antworten[q];
    n++;
    zeilen.push(q.toUpperCase() + " [" + TYPNAME[f.typ] + "] " + f.frage);
    if (!e) { zeilen.push("  Nicht beantwortet."); zeilen.push(""); continue; }
    p += e.selbst ? 0 : (e.punkte || 0);
    zeilen.push("  Meine Antwort: " + (e.gegeben || "—") + (e.unsicher ? " (unsicher)" : ""));
    zeilen.push("  Bewertung: " + (e.selbst ? "noch nicht bewertet" : e.punkte >= 1 ? "richtig" : e.punkte > 0 ? "teilweise" : "falsch"));
    if (f.typ !== "text" && e.punkte < 1) zeilen.push("  Lösung: " + loesungText(f));
    zeilen.push("");
  }
  zeilen.splice(2, 0, "Ergebnis: " + fmtNum(p, p % 1 ? 1 : 0) + " von " + n + " (" + pct(p, n) + " %)");
  return zeilen.join("\n");
}
function gesamtText() {
  const g = gesamtStats();
  const z = ["HBOD Lern-App – Gesamtstand", "Fragenkatalog " + S.daten.version + " (" + S.daten.stand + ")",
    g.beantwortet + " von " + g.gesamt + " beantwortet, " + g.richtig + " richtig, " + g.meister + " gemeistert, " + serie() + " Tage in Folge.", ""];
  for (const t of S.daten.tests) { const s = testStats(t); if (s.beantwortet) z.push(t.id.toUpperCase() + " " + t.titel + ": " + s.beantwortet + "/" + s.gesamt + ", " + pct(s.punkte, s.gesamt) + " %"); }
  const falsch = S.reihenfolge.filter(q => S.antworten[q] && S.antworten[q].punkte < 1);
  if (falsch.length) { z.push("", textBlock("Fragen, die noch nicht sitzen", falsch)); }
  if (Object.keys(S.notizen).length) z.push("", notizenText());
  return z.join("\n");
}
async function kopiere(text, meldung) {
  try { await navigator.clipboard.writeText(text); toast(meldung || "Kopiert. Füge es im Chat mit Claude ein."); }
  catch (e) {
    const ta = h("textarea", { class: "copyarea", readonly: true }); ta.value = text;
    $("#app").prepend(h("div", { class: "panel stack", style: "margin-top:16px" }, h("p", null, "Kopieren ging nicht automatisch. Markiere den Text und kopiere ihn selbst:"), ta));
    ta.focus(); ta.select(); window.scrollTo({ top: 0 });
  }
}
function kopiereTest(tid) { const t = S.tests[tid]; kopiere(textBlock(t.id.toUpperCase() + " " + t.titel, t.fragen.map(f => f.id))); }
function kopiereLauf(L) { kopiere(textBlock(L.titel + " (" + (L.modus === "pruefung" ? "Prüfungsmodus" : "Lernmodus") + ")", L.qids, L.ergebnisse)); }

/* ================= Start ================= */
async function ladeDaten() {
  try {
    const r = await fetch("/fragen.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    indexDaten(await r.json());
    return true;
  } catch (e) {
    $("#app").replaceChildren(h("div", { class: "panel empty", style: "margin-top:20px" }, "Der Fragenkatalog konnte nicht geladen werden. ", h("button", { class: "btn", type: "button", onclick: () => location.reload() }, "Neu laden")));
    return false;
  }
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.installPrompt = e; if (S.ansicht === "geraete") render(); });
async function start() {
  lsLoad();
  renderStatus();
  if (!(await ladeDaten())) return;
  bereinige();
  fromHash();
  if (S.code) { await holen(); }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    try { await navigator.serviceWorker.register("/sw.js"); } catch (e) {}
  }
}
start();
