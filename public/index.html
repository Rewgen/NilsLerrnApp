<style>
:root {

/* ================= Notizen, Anmerkungen und Wünsche ================= */
// Kreislauf: Nils merkt an oder wünscht sich etwas -> die App zeigt sofort Ähnliches aus dem Katalog -> Claude prüft beim Einarbeiten
// (inhalte/suche.py), baut ein und antwortet in inhalte/rueckmeldungen.py -> die Antwort steht hier an der Notiz, die Notiz gilt als erledigt.
const NOTIZ_TYP = { pruefen: "Antwort prüfen", unklar: "Unklar", doppelt: "Doppelt", ergaenzung: "Ergänzung", frage: "Wunsch: neue Frage", thema: "Wunsch: neues Thema", erkenntnis: "Erkenntnis", sonstiges: "Anmerkung" };
const NOTIZ_FARBE = { pruefen: "bad", unklar: "part", doppelt: "part", ergaenzung: "acc", frage: "acc", thema: "acc", erkenntnis: "ok", sonstiges: "" };
function notizTyp(n) { if (n && n.typ && NOTIZ_TYP[n.typ]) return n.typ; if (n && n.art === "wunsch") return "frage"; return n && n.frage_id ? "sonstiges" : "erkenntnis"; }
function rueckVon(n) { return (S.daten && S.daten.rueckmeldungen && S.daten.rueckmeldungen[n.id]) || null; }
function notizStatus(n) {
  if (!n) return "offen";
  if (n.status === "geloescht") return "geloescht";
  if (n.status === "erledigt") return "erledigt";
  const r = rueckVon(n);
  if (r && !(n.wieder && n.wieder > r.zeit)) return "erledigt";
  return "offen";
}
let PAUSE = null; // Fragen mit offener Anmerkung "bis zur Prüfung nicht abfragen"
function pausiert(q) {
  if (!PAUSE) { PAUSE = new Set(); for (const n of Object.values(S.notizen)) if (n && n.pause && n.frage_id && notizStatus(n) === "offen") PAUSE.add(n.frage_id); }
  return PAUSE.has(q);
}
function offeneAnmerkungen(q) { return Object.values(S.notizen).filter(n => n && n.frage_id === q && notizStatus(n) === "offen"); }
function notizId() { const b = new Uint8Array(6); crypto.getRandomValues(b); return "n" + Date.now().toString(36) + [...b].map(x => x.toString(36)).join("").slice(0, 8); }
function speichereNotiz(n, meldung) {
  const id = notizId(); n.id = id; n.zeit = nowIso();
  S.notizen[id] = n; S.outbox.notizen[id] = n; PAUSE = null; planeSync(500);
  toast((meldung || "Gespeichert.") + (S.code ? "" : " Verbinde deine Geräte, damit es überall da ist."));
}
function setzeNotizStatus(n, status) {
  const neu = Object.assign({}, n, { status, zeit: nowIso() });
  if (status === "offen" && rueckVon(n)) neu.wieder = nowIso(); // nach Claudes Antwort wieder geöffnet
  S.notizen[n.id] = neu; S.outbox.notizen[n.id] = neu; PAUSE = null; planeSync(500); render();
}

const STOPW = new Set(("der die das ein eine einer eines einem einen und oder ist sind was wie wer wo warum wann welche welcher welches bei mit von für auf aus im in an zu zum zur " +
  "den dem des nicht kein keine es sie er man du ich wir ihr hbod sich auch als dass so nur noch dann wenn über etwa je pro bis vom am um wird werden kann muss darf hat haben " +
  "gibt mehr sehr oft kreuze alles richtige richtig falsch marke kunde kunden ihre ihren deine deiner dein diese dieser dieses").split(" "));
function woerter(t) { return (String(t || "").toLowerCase().match(/[a-zäöüß0-9]+/g) || []).filter(w => w.length > 2 && !STOPW.has(w) && !/^\d+$/.test(w)).map(w => w.slice(0, 7)); }
let SUCHINDEX = null;
function suchIndex() {
  if (SUCHINDEX) return SUCHINDEX;
  const eintraege = [];
  for (const q of S.reihenfolge) { const f = S.fragen[q]; eintraege.push({ art: "frage", id: q, text: [f.frage, f.frage, loesungText(f), f.erklaerung].join(" ") }); }
  for (const th of Object.values(S.themen)) eintraege.push({ art: "thema", id: th.id, text: [th.titel, th.titel, th.titel, th.kurz].concat(th.punkte).join(" ") });
  const df = new Map();
  const zaehle = (text) => { const c = new Map(); for (const w of woerter(text)) c.set(w, (c.get(w) || 0) + 1); return c; };
  const docs = eintraege.map(e => { const c = zaehle(e.text); for (const w of c.keys()) df.set(w, (df.get(w) || 0) + 1); return c; });
  const N = eintraege.length;
  const vek = (c) => { const v = new Map(); let n2 = 0; for (const [w, n] of c) { const x = (1 + Math.log(n)) * Math.log((N + 1) / ((df.get(w) || 0) + 0.5)); v.set(w, x); n2 += x * x; } const norm = Math.sqrt(n2) || 1; for (const [w, x] of v) v.set(w, x / norm); return v; };
  SUCHINDEX = { eintraege, zaehle, vek, vecs: docs.map(vek) };
  return SUCHINDEX;
}
function aehnliche(text, n = 6, ohne = null, schwelle = 0.12) {
  const ix = suchIndex(); const c = ix.zaehle(text);
  if (!c.size) return [];
  const q = ix.vek(c); const out = [];
  ix.vecs.forEach((v, i) => { let s = 0; for (const [w, x] of q) s += x * (v.get(w) || 0); const e = ix.eintraege[i]; if (s >= schwelle && e.id !== ohne) out.push(Object.assign({ s }, e)); });
  return out.sort((a, b) => b.s - a.s).slice(0, n);
}

/* ================= Kopieren für Claude ================= */
function textBlock(titel, qids, ergebnisse) {
  const zeilen = ["HBOD Lern-App – " + titel, "Fragenkatalog " + S.daten.version + " (" + S.daten.stand + ")", ""];
  let p = 0, n = 0;
  for (const q of qids) {
    const f = S.fragen[q]; const e = (ergebnisse && ergebnisse[q]) || S.antworten[q];
    n++;
    zeilen.push(q.toUpperCase() + " [" + TYPNAME[f.typ] + "] " + f.frage);
    if (!e) { zeilen.push("  Nicht beantwortet."); zeilen.push(""); continue; }
    p += e.selbst ? 0 : (e.punkte || 0);
    zeilen.push("  Meine Antwort: " + (e.gegeben || "—") + (e.unsicher ? " (unsicher)" : ""));
    zeilen.push("  Bewertung: " + (e.selbst ? "noch nicht bewertet" : e.punkte >= 1 ? "richtig" : e.punkte > 0 ? "teilweise" : "falsch"));
    if (f.typ !== "text" && e.punkte < 1) zeilen.push("  Lösung: " + loesungText(f));
    zeilen.push("");
  }
  zeilen.splice(2, 0, "Ergebnis: " + fmtNum(p, p % 1 ? 1 : 0) + " von " + n + " (" + pct(p, n) + " %)");
  return zeilen.join("\n");
}
function gesamtText() {
  const g = gesamtStats();
  const z = ["HBOD Lern-App – Gesamtstand", "Fragenkatalog " + S.daten.version + " (" + S.daten.stand + ")",
    g.beantwortet + " von " + g.gesamt + " beantwortet, " + g.richtig + " richtig, " + g.meister + " gemeistert, " + serie() + " Tage in Folge.", ""];
  for (const t of S.daten.tests) { const s = testStats(t); if (s.beantwortet) z.push(t.id.toUpperCase() + " " + t.titel + ": " + s.beantwortet + "/" + s.gesamt + ", " + pct(s.punkte, s.gesamt) + " %"); }
  const falsch = S.reihenfolge.filter(q => S.antworten[q] && S.antworten[q].punkte < 1);
  if (falsch.length) { z.push("", textBlock("Fragen, die noch nicht sitzen", falsch)); }
  if (Object.keys(S.notizen).length) z.push("", notizenText());
  return z.join("\n");
}
async function kopiere(text, meldung) {
  try { await navigator.clipboard.writeText(text); toast(meldung || "Kopiert. Füge es im Chat mit Claude ein."); }
  catch (e) { kopierFallback(text); }
}
function kopierFallback(text) {
  const ta = h("textarea", { class: "copyarea", readonly: true }); ta.value = text;
  $("#app").prepend(h("div", { class: "panel stack", style: "margin-top:16px" }, h("p", null, "Kopieren ging nicht automatisch. Markiere den Text und kopiere ihn selbst:"), ta));
  ta.focus(); ta.select(); window.scrollTo({ top: 0 });
}

/* ================= Claude-Chats: Erklärung im eigenen Chat ================= */
// Die Chats (Name + claude.ai-Link) stehen in den Einstellungen und werden mit dem Lern-Code auf alle Geräte übertragen.
// Ein Chat lässt sich per Link nicht zuverlässig vorausfüllen. Deshalb: Text in die Zwischenablage, Chat öffnen, dort einfügen.
const CLAUDE_RE = /^https:\/\/(www\.)?claude\.ai\/\S*$/i;
function pruefeChatLink(roh) {
  const u = String(roh || "").trim();
  if (!CLAUDE_RE.test(u)) return { fehler: "Der Link muss mit https://claude.ai/ beginnen." };
  if (/claude\.ai\/share\//i.test(u)) return { fehler: "Das ist ein Teilen-Link, er zeigt nur eine Kopie. Nimm die Adresse aus der Adresszeile: https://claude.ai/chat/…" };
  return { url: u };
}
function standardChat() { const l = chats(); return l.find(c => c.id === S.einstellungen.chatStandard) || l[0] || null; }
function chatHinzufuegen(name, url) {
  const alt = chats().find(c => c.url === url);
  if (alt) { setzeEinstellung({ chatStandard: alt.id }); toast("Diesen Chat gibt es schon. Er ist jetzt Standard."); return; }
  const c = { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: String(name).slice(0, 40), url };
  setzeEinstellung({ chats: chats().concat(c).slice(-12), chatStandard: c.id });
  toast("Chat „" + c.name + "“ gespeichert" + (S.code ? ", auch auf deinen anderen Geräten." : "."));
}
function chatEntfernen(id) {
  const l = chats().filter(c => c.id !== id);
  setzeEinstellung({ chats: l, chatStandard: S.einstellungen.chatStandard === id ? (l[0] ? l[0].id : null) : S.einstellungen.chatStandard });
}
function claudeKopieren(text, chat) {
  const ok = () => toast("Kopiert. Im Chat „" + chat.name + "“ einfügen und senden.");
  try { navigator.clipboard.writeText(text).then(ok, () => kopierFallback(text)); } catch (e) { kopierFallback(text); }
}
function claudeAnker(text, chat, label, cls) {
  const a = h("a", { class: cls, href: chat.url, target: "_blank", rel: "noopener" }, label);
  a.addEventListener("click", () => claudeKopieren(text, a._chat || chat));
  a._chat = chat;
  return a;
}
function chatFormular(onFertig, onAbbruch) {
  const name = h("input", { type: "text", placeholder: "Name, z. B. Erklär-Chat", maxlength: "40", "aria-label": "Name des Chats" });
  const url = h("input", { type: "url", inputmode: "url", placeholder: "https://claude.ai/chat/…", autocomplete: "off", spellcheck: "false", autocapitalize: "off", "aria-label": "Link zum Claude-Chat" });
  const speichern = () => {
    const r = pruefeChatLink(url.value);
    if (r.fehler) { toast(r.fehler); url.focus(); return; }
    chatHinzufuegen(name.value.trim() || "Chat " + (chats().length + 1), r.url);
    if (onFertig) onFertig();
  };
  url.addEventListener("keydown", (e) => { if (e.key === "Enter") speichern(); });
  return h("div", { class: "chatform" },
    h("p", { class: "small" }, "So bekommst du den Link: Öffne claude.ai im Browser, am einfachsten am PC. Starte im Projekt HBOD einen Chat, z. B. „Erklär-Chat“, schick eine erste Nachricht und kopiere dann die Adresse aus der Adresszeile. Sie sieht so aus: https://claude.ai/chat/…"),
    name, url,
    h("div", { class: "claude-row" },
      h("button", { class: "btn primary", type: "button", onclick: speichern }, "Chat speichern"),
      onAbbruch ? h("button", { class: "btn ghost", type: "button", onclick: onAbbruch }, "Abbrechen") : null),
    h("p", { class: "small muted" }, "Ein Projekt-Link (https://claude.ai/project/…) geht auch: Dann öffnet sich das Projekt und du startest dort jedes Mal einen neuen Chat, der deine Dokumente kennt. Auf dem Handy öffnet der Link die Claude-App oder claude.ai im Browser."));
}
// Unter einer Erklärung: Chat wählen, Text kopieren, Chat öffnen
function claudeBox(text, label = "In Claude erklären lassen") {
  const box = h("div", { class: "claude-box" });

  function zeichne() {
    const liste = chats();

/* ================= Start ================= */
async function ladeDaten() {
  try {
    const r = await fetch("/fragen.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    indexDaten(await r.json());
    return true;
  } catch (e) {
    $("#app").replaceChildren(h("div", { class: "panel empty", style: "margin-top:20px" }, "Der Fragenkatalog konnte nicht geladen werden. ", h("button", { class: "btn", type: "button", onclick: () => location.reload() }, "Neu laden")));
    return false;
  }
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.installPrompt = e; if (S.ansicht === "geraete") render(); });
async function start() {
  lsLoad();
  renderStatus();
  if (!(await ladeDaten())) return;
  bereinige();
  if (!S.code) migriereEinstellungen();
  else if (!(S.einstellungen && S.einstellungen.ziel5) && !(S.einstellungen && S.einstellungen.zeit)) migriereEinstellungen(); // nur lokal, ohne Zeitstempel
  fromHash();
  if (S.code) { await holen(); }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    try { await navigator.serviceWorker.register("/sw.js"); } catch (e) {}
  }
}
start();
})();
